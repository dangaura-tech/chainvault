name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint Solidity
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test
      - name: Coverage
        run: npm run coverage
